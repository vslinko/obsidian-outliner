name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - created

env:
  OBSIDIAN_VERSION: "1.15.0"
  NODE_VERSION: 26

jobs:
  test-and-release-on-linux:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Install Obsidian
        run: |
          sudo apt update
          sudo apt install flatpak dbus-x11 xvfb
          flatpak remote-add --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub md.obsidian.Obsidian
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: |
          npm run lint
      - name: Test
        run: |
          npm run test:release
          npm run build-with-tests
          Xvfb -ac :0 -screen 0 1280x1024x16 &
          export DISPLAY=:0
          export $(dbus-launch)
          npm test
      - name: Build release
        if: ${{ github.event_name == 'release' }}
        run: npm run build
      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY"
  test-on-osx:
    # Temporarily disabled due to hosted macOS runner capacity constraints.
    if: ${{ false }}
    runs-on: macos-26
    steps:
      - name: Install Obsidian
        run: |
          wget -q https://github.com/obsidianmd/obsidian-releases/releases/download/v$OBSIDIAN_VERSION/Obsidian-$OBSIDIAN_VERSION.dmg
          sudo hdiutil attach "Obsidian-$OBSIDIAN_VERSION.dmg" -mountpoint /Volumes/Obsidian
          sudo cp -rf /Volumes/Obsidian/Obsidian.app /Applications
          sudo hdiutil detach /Volumes/Obsidian
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          npm run build-with-tests
          npm test
